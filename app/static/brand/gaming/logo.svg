 <g transform="translate(400 655) skewX(-10)">
  <text x="0" y="0" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="178" letter-spacing="-4" fill="#07061a" stroke="#07061a" stroke-width="26" stroke-linejoin="round">LCMC</text>
