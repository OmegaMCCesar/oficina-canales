  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ff4a"/><stop offset=".5" stop-color="#7cf5c9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
