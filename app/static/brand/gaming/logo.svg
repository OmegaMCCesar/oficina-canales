 </g>
 <!-- hexágono -->
 <polygon points="400,105 610,226 610,454 400,575 190,454 190,226" fill="#0d0a2b" stroke="url(#rim)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
 <polygon points="400,140 580,244 580,436 400,540 220,436 220,244" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="4"/>
 <!-- rayo -->
 <path d="M432 165 L300 365 L388 365 L352 520 L505 300 L414 300 L462 165 Z" fill="url(#bolt)" stroke="#07061a" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
